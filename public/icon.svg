<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.6" />

  <!-- Inner Glowing Halo -->
  <circle cx="256" cy="256" r="110" fill="url(#glowGrad)" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Bot Head Base -->
  <rect x="156" y="166" width="200" height="170" rx="46" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Antenna -->
  <line x1="256" y1="166" x2="256" y2="118" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="106" r="16" fill="#2dd4bf" filter="url(#neonGlow)" />

  <!-- Visor / Eyes -->
  <rect x="186" y="210" width="140" height="48" rx="24" fill="#020617" stroke="rgba(20, 184, 166, 0.5)" stroke-width="3" />
  <circle cx="226" cy="234" r="12" fill="#2dd4bf" filter="url(#neonGlow)" />
  <circle cx="286" cy="234" r="12" fill="#2dd4bf" filter="url(#neonGlow)" />

  <!-- Medical Cross / Telephony Soundwave on Chest -->
  <path d="M226 294 h60 M256 264 v60" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Ear Radios -->
  <rect x="136" y="216" width="18" height="56" rx="8" fill="#14b8a6" />
  <rect x="358" y="216" width="18" height="56" rx="8" fill="#14b8a6" />

  <!-- Vital Pulse Wave at Bottom -->
  <path d="M120 400 h90 l20 -30 l26 60 l24 -46 l16 16 h96" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#neonGlow)" />
</svg>
